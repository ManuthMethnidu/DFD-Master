[build]
  publish = "dist"
  command = "bun run build"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_DATABASE_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"
  SECRETS_SCAN_OMIT_PATHS = "index.html,dist/index.html,public/robots.txt,dist/robots.txt,public/sitemap.xml,dist/sitemap.xml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/pwa-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/png"

[[headers]]
  for = "/apple-touch-icon*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/png"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
