<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Process Interrupted | DFD Master</title>
    <meta name="description" content="Entity or process not found in DFD Master.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F9F9FB;
        --ink: #111111;
        --surface: #FFFFFF;
        --line: #111111;
        --shadow: 17, 17, 17;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121214;
          --ink: #EDEDED;
          --surface: #1B1B1F;
          --line: #383842;
          --shadow: 0, 0, 0;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--ink);
        font-family: 'Inter', -apple-system, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background: var(--surface);
        border: 4px solid var(--line);
        padding: 2.5rem 2rem;
        max-width: 680px;
        width: 100%;
        box-shadow: 12px 12px 0px 0px rgba(var(--shadow), 1);
      }
      .badge {
        display: inline-block;
        border: 2px solid var(--line);
        background: var(--bg);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.35rem 0.75rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        font-weight: 900;
        font-style: italic;
        line-height: 1;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
      }
      p {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.8;
        margin-bottom: 2rem;
        line-height: 1.5;
      }
      .diagram {
        background: var(--bg);
        border: 2px solid var(--line);
        padding: 1.25rem;
        margin-bottom: 2rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .node {
        border: 2px solid var(--line);
        background: var(--surface);
        padding: 0.5rem 0.75rem;
        font-weight: 700;
        text-align: center;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 1.6rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .btn-primary {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0px 0px rgba(var(--shadow), 1);
      }
      .btn-primary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px 0px rgba(var(--shadow), 1);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--ink);
        border: 2px solid var(--line);
        box-shadow: 4px 4px 0px 0px rgba(var(--shadow), 1);
      }
      .btn-secondary:hover {
        background: var(--bg);
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px 0px rgba(var(--shadow), 1);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HTTP 404 &bull; Entity Not Found</div>
      <h1>Process Interrupted</h1>
      <p>The requested data flow does not exist within the system boundary.</p>
      
      <div class="diagram">
        <div class="node">[ Entity: User ]</div>
        <div>&rarr; Invalid Path &rarr;</div>
        <div class="node" style="border-style: dashed; color: #ef4444;">( 404 Process )</div>
        <div>&times; Severed &times;</div>
        <div class="node">[ Void ]</div>
      </div>

      <div class="btn-row">
        <a href="/" class="btn btn-primary">&larr; Back to Simulator</a>
        <a href="/leaderboard" class="btn btn-secondary">Hall of Fame</a>
      </div>
    </div>
  </body>
</html>
