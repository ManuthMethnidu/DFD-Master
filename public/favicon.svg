<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <g fill="#000000" stroke="#000000">
    <!-- Left Arrow (Input) -->
    <!-- Stem: x=42 to 108, y=245 to 267 (thickness 22) -->
    <rect x="42" y="245" width="66" height="22" stroke="none" fill="#000000" />
    <!-- Arrowhead: base x=108 (y=216 to 296), tip x=168 (y=256) -->
    <polygon points="108,216 168,256 108,296" stroke="none" fill="#000000" />

    <!-- Center Ring (Process with left gap) -->
    <!-- Center (256, 256), Radius 108, Stroke 24 -->
    <!-- Arc starts after gap at 145 deg (x=167.5, y=194) and ends at 215 deg (x=167.5, y=318) -->
    <path d="M 168 194 A 108 108 0 1 1 168 318" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="butt" />

    <!-- Right Arrow (Output) -->
    <!-- Stem starts at outer circle edge x=364 to 426, y=245 to 267 -->
    <rect x="364" y="245" width="62" height="22" stroke="none" fill="#000000" />
    <!-- Arrowhead: base x=426 (y=216 to 296), tip x=486 (y=256) -->
    <polygon points="426,216 486,256 426,296" stroke="none" fill="#000000" />
  </g>
</svg>