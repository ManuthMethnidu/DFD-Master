<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision">
  
  <g fill="#000000" stroke="#000000">
    <!-- Left Input Arrow: Stem x=64..124, Head x=124..180 -->
    <rect x="64" y="244" width="60" height="24" stroke="none" fill="#000000" />
    <polygon points="124,212 180,256 124,300" stroke="none" fill="#000000" />

    <!-- Center Process Ring: Center (256, 256), Radius 98, Stroke 24 -->
